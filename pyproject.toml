[tool.pytest.ini_options]
# Root-level pytest configuration for the VerifAI backend test suite.
minversion = "8.0"
testpaths = [
    "backend/tests",
]
pythonpath = [".", "backend"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
# Treat backend/app as first-party regardless of the working directory.
src = [".", "backend"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
# BLE (blind except) is deliberately not enabled: retrievers, judges, and probes
# catch broad exceptions by design to degrade gracefully instead of failing the
# request. This rule set matches what backend/ has always been checked against.
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["E501"]
"backend/migrations/versions/*" = ["E501"]  # autogenerated

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^backend/\\.venv/",
]
