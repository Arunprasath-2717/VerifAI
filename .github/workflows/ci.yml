name: CI — Fullstack Smoke & Build Verification

on:
  push:
    branches:
      - Final
      - main
  pull_request:
    branches:
      - Final
      - main

permissions:
  contents: read

jobs:
  backend-smoke:
    name: Backend Smoke Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: backend
      VERIFAI_TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend Application Smoke Test
        run: |
          python scripts/smoke_test.py

      - name: Run Database Guard & Core Health Tests
        run: |
          pytest backend/tests/test_test_database_guard.py backend/tests/test_health.py -v

  frontend-smoke:
    name: Frontend Smoke Tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python for Smoke Prober
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Run Frontend Production Preview Smoke Test
        run: npm run test:smoke

  fullstack-verified:
    name: Fullstack Verification Status
    needs: [backend-smoke, frontend-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Report Success
        run: |
          echo "✓ All backend and frontend smoke tests passed."
          echo "✓ Pull request and branch are verified and ready for merge."
