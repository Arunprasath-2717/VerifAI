name: Backend CI & Hermetic Verification

on:
  push:
    branches:
      - Final
  pull_request:
    branches:
      - Final
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Dependency Graph Integrity
        run: |
          python -m pip check

      - name: Run Ruff Linting
        run: |
          PYTHONPATH=. ruff check backend scripts benchmark

      - name: Run Ruff Formatting Verification
        run: |
          PYTHONPATH=. ruff format --check backend scripts benchmark

      - name: Run Mypy Static Type Checking
        run: |
          PYTHONPATH=. mypy backend/app benchmark

      - name: Run Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest backend/tests -v

      - name: Run Benchmark Pytest Suite
        run: |
          PYTHONPATH=. pytest benchmark/tests -v

      - name: Run Automated Application Smoke Test
        run: |
          PYTHONPATH=. python scripts/smoke_test.py

      - name: Run Benchmark Dataset Validation
        run: |
          PYTHONPATH=. python scripts/benchmark_tool.py validate
