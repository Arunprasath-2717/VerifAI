name: Backend CI & Hermetic Verification

on:
  push:
    branches:
      - main
      - Final
  pull_request:
    branches:
      - main
      - Final

permissions:
  contents: read

jobs:
  verify:
    name: Verify Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: verifai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Verify Dependency Graph Integrity
        run: |
          python -m pip check

      - name: Run Ruff Linting
        run: |
          PYTHONPATH=. ruff check backend scripts

      - name: Run Ruff Formatting Verification
        run: |
          PYTHONPATH=. ruff format --check backend scripts

      - name: Run Mypy Static Type Checking
        run: |
          PYTHONPATH=. mypy backend/app

      - name: Run Backend Pytest Suite
        run: |
          PYTHONPATH=. pytest backend/tests -v

      - name: Run Automated Application Smoke Test
        run: |
          PYTHONPATH=. python scripts/smoke_test.py

      - name: Verify Database Migrations (apply, drift check, round-trip)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:ci-only-password@localhost:5432/verifai_ci
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
