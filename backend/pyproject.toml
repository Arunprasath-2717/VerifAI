[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verifai-backend"
version = "0.1.0"
description = "VerifAI — Cross-Generation Consistency Hallucination Risk Analysis Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.54",
    "asyncpg==0.31.0",
    "alembic==1.16.4",
    "greenlet==3.5.6",
    "httpx==0.28.1",
    "argon2-cffi==25.1.0",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.32",
    "cryptography==50.0.2",
    "certifi==2026.10.18",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "migrations*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*BlockingPortal.*:DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E501", "E402", "I001", "UP035", "UP007", "W291"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "^.venv/",
]
