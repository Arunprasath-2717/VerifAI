[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# Packaging metadata only. Tool configuration (pytest, ruff, mypy) lives in the
# repository-root pyproject.toml so there is a single source of truth.
# Exact, reproducible pins live in requirements*.txt.

[project]
name = "verifai-backend"
version = "0.1.0"
description = "VerifAI — Cross-Generation Consistency Hallucination Risk Analysis Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "httpx>=0.27.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
live = [
    "ddgs>=9.16",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
