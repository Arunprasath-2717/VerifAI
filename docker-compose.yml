# ==============================================================================
# VerifAI — Docker Compose Configuration
# Production-ready local development and deployment stack
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-verifai}:${POSTGRES_PASSWORD:-verifai_dev_secret}@db:5432/${POSTGRES_DB:-verifai}
      - API_V1_STR=/api/v1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-insecure_development_jwt_secret_replace_in_prod}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verifai-network

  db:
    image: postgres:16-alpine
    container_name: verifai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-verifai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-verifai_dev_secret}
      - POSTGRES_DB=${POSTGRES_DB:-verifai}
    ports:
      - "5432:5432"
    volumes:
      - verifai_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verifai} -d ${POSTGRES_DB:-verifai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - verifai-network

networks:
  verifai-network:
    driver: bridge

volumes:
  verifai_pgdata:
    driver: local
