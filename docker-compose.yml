# ==============================================================================
# VerifAI — Docker Compose Configuration
# Safer container stack: explicit secrets and loopback-only host ports by default
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verifai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_BIND_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-verifai}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}@db:5432/${POSTGRES_DB:-verifai}
      - API_V1_STR=/api/v1
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be configured}
      - PROVIDER_CREDENTIAL_ENCRYPTION_KEY=${PROVIDER_CREDENTIAL_ENCRYPTION_KEY:?PROVIDER_CREDENTIAL_ENCRYPTION_KEY must be configured}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - verifai-network

  db:
    image: postgres:16-alpine
    container_name: verifai-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-verifai}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be configured}
      - POSTGRES_DB=${POSTGRES_DB:-verifai}
    ports:
      - "${POSTGRES_BIND_HOST:-127.0.0.1}:${POSTGRES_BIND_PORT:-5432}:5432"
    volumes:
      - verifai_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-verifai} -d ${POSTGRES_DB:-verifai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - verifai-network

networks:
  verifai-network:
    driver: bridge

volumes:
  verifai_pgdata:
    driver: local
